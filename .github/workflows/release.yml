name: Release

# MANUAL TRIGGER ONLY. Pushing a `vX.Y.Z` tag does NOT auto-fire
# this workflow — by design, so you can keep dev versions local
# (build.ps1 + manual installs) without anything being uploaded
# to GitHub until you explicitly ask.
#
# To cut a public release (the maintainer's /release skill, step 5):
#   1. Push main: test.yml runs the suite on Ubuntu, Windows and macOS,
#      each on Zotero stable and beta, for that commit.
#   2. Once it is green, push the tag: `git push origin vX.Y.Z`
#      (a tag push starts no workflow).
#   3. Run this workflow on the tag (Actions → "Release" → "Run workflow",
#      or `gh workflow run release.yml -f tag=vX.Y.Z`): it checks that
#      test.yml passed on the tag's commit, then builds and publishes.
#      It does not run the suite again (MJT 2026-11-03: the release run's
#      single Ubuntu pass repeated what test.yml had just checked on six
#      jobs, and cost ~10 minutes).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.8.0)"
        required: true

permissions:
  contents: write     # create the release + upload assets
  issues: write       # for release-comment notifications
  pull-requests: write
  actions: read       # read test.yml's result for the tag's commit

# Same Node 24 opt-in as test.yml — see comment there.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build, test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Need the full history so the changelog generator can
          # walk back to the previous tag.
          fetch-depth: 0
          # Optional manual-trigger path — check out the tag the
          # user picked from the Actions UI.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scaffold's update check off: a rate-limited answer crashes the
      # CLI before the build (ci/prepare.mjs).
      - name: Prepare (no outside downloads)
        run: node ci/prepare.mjs

      - name: Type-check (regression gate)
        run: npm run typecheck

      # The gate: test.yml green on this exact commit (its push run, any
      # attempt -- a rerun of a flaky job counts). No suite run here.
      - name: Require a green Test run on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$sha" --limit 20 \
            --json conclusion,status --jq '[.[] | select(.status == "completed") | .conclusion] | if index("success") then "success" else (.[0] // "none") end')"
          echo "test.yml on $sha: $result"
          if [ "$result" != "success" ]; then
            echo "::error::test.yml has no green run on $sha (got: $result). Push main, wait for Test to pass, then run this workflow."
            exit 1
          fi

      - name: Build XPI
        run: npm run build

      - name: Publish release
        # Scaffold's release command, when run in CI with a
        # GITHUB_TOKEN, creates the GitHub release tagged with
        # the current `package.json` version, uploads the .xpi
        # from `.scaffold/build/`, and updates the rolling
        # `release` tag's `update.json`.
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tell the scaffold to skip its interactive bump prompt
          # — the tag has already determined the version.
          NODE_ENV: production
          CI: "true"
