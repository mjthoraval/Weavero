name: Release

# MANUAL TRIGGER ONLY. Pushing a `vX.Y.Z` tag does NOT auto-fire
# this workflow — by design, so you can keep dev versions local
# (build.ps1 + manual installs) without anything being uploaded
# to GitHub until you explicitly ask.
#
# To cut a public release (the maintainer's /release skill, step 5):
#   1. Push main: test.yml runs the suite on Ubuntu, Windows and macOS,
#      each on Zotero stable and beta, for that commit.
#   2. Once it is green, push the tag: `git push origin vX.Y.Z`
#      (a tag push starts no workflow).
#   3. Run this workflow on the tag (Actions → "Release" → "Run workflow",
#      or `gh workflow run release.yml -f tag=vX.Y.Z`): it checks that
#      test.yml passed on the tag's commit, then builds and publishes.
#      It does not run the suite again (MJT 2026-11-03: the release run's
#      single Ubuntu pass repeated what test.yml had just checked on six
#      jobs, and cost ~10 minutes).
#   4. It publishes the release and its XPI but leaves the update
#      manifests alone: nobody is offered it yet. Install the published
#      XPI, check it, then run flip.yml on the tag to switch the manifests
#      on (2026-11-03, "stage, then flip").
#
# Two jobs (2026-11-22). `build` runs every third-party line of the release
# -- npm's packages, the scaffold, the build -- with a READ-ONLY token, and
# hands the XPI and the release notes on as an artifact. `publish` holds the
# write token and runs no code of the repository's or npm's: GitHub's own
# `gh` creates the release from the artifact, as the scaffold's release
# command did (a draft, the XPI uploaded, then published; a pre-release when
# the version has a "-"). Its environment, `release`, is where a required
# reviewer goes (repository settings).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.8.0)"
        required: true

# Nothing unless a job asks for it.
permissions: {}

# Same Node 24 opt-in as test.yml — see comment there.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read       # read test.yml's result for the tag's commit
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # The input reaches a shell only through the environment, checked.
      - name: Check the tag's form
        env:
          TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a version tag: $TAG"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Need the full history so the changelog generator can
          # walk back to the previous tag.
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}
          # No token left on disk for the steps after this one.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # No install script of any package runs: esbuild and @swc/core load
      # their platform binaries from their optional dependencies, which npm
      # installs anyway; the scripts only verify them (es5-ext's prints a
      # message, fsevents is macOS-only).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The scaffold's update check off: a rate-limited answer crashes the
      # CLI before the build (ci/prepare.mjs).
      - name: Prepare (no outside downloads)
        run: node ci/prepare.mjs

      - name: Type-check (regression gate)
        run: npm run typecheck

      # The gate: test.yml green on this exact commit, from a PUSH to main
      # (any attempt -- a rerun of a flaky job counts). A pull request's run
      # does not count: it runs the pull request's own copy of test.yml.
      - name: Require a green Test run on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$sha" --event push --branch main --limit 20 \
            --json conclusion,status --jq '[.[] | select(.status == "completed") | .conclusion] | if index("success") then "success" else (.[0] // "none") end')"
          echo "test.yml on $sha: $result"
          if [ "$result" != "success" ]; then
            echo "::error::test.yml has no green push run on main for $sha (got: $result). Push main, wait for Test to pass, then run this workflow."
            exit 1
          fi

      - name: The tag names package.json's version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$TAG" ]; then
            echo "::error::package.json says $v, the tag is $TAG"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build XPI
        run: npm run build

      # The release notes the scaffold's release command wrote: its
      # changelog of the commits since the previous tag (changelogen's
      # convention-based groups -- see zotero-plugin.config.ts).
      - name: Release notes
        shell: bash
        env:
          NOTES: ${{ github.workspace }}/release-out/notes.md
        run: |
          mkdir -p release-out
          node --input-type=module -e '
            import { Config, Release } from "zotero-plugin-scaffold";
            import { writeFileSync } from "node:fs";
            const ctx = await Config.loadConfig();
            const b = ctx.release.bumpp;
            b.tag = String(b.tag).replaceAll("%s", ctx.version);
            b.commit = String(b.commit).replaceAll("%s", ctx.version);
            writeFileSync(process.env.NOTES, String(await new Release(ctx).getChangelog() || ""));
          '
          cp .scaffold/build/weavero.xpi release-out/weavero.xpi
          ls -la release-out

      - uses: actions/upload-artifact@v7
        with:
          name: release-out
          path: release-out
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A required reviewer goes on this environment (repository settings).
    environment: release
    permissions:
      contents: write     # create the release + upload the XPI

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-out
          path: ${{ runner.temp }}/release-out

      # No checkout, no npm: only gh, with the files the build job made.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          OUT: ${{ runner.temp }}/release-out
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG and version $VERSION do not agree"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx weavero.xpi; then
              echo "::warning::Release $TAG already holds weavero.xpi: nothing uploaded"
            else
              gh release upload "$TAG" "$OUT/weavero.xpi" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          kind=(--latest)
          case "$VERSION" in *-*) kind=(--prerelease) ;; esac
          gh release create "$TAG" "$OUT/weavero.xpi" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Release v$VERSION" --notes-file "$OUT/notes.md" "${kind[@]}"
