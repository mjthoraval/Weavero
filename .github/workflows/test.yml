name: Test

# Run the Mocha/Chai suite against a real Zotero on every PR and on every
# push to main: the three desktop systems, each on Zotero's stable and beta
# channels (MJT 2026-11-03, "Ok to cover all 3 OSs and both stable and beta
# in each OS"). Each job downloads its Zotero from zotero.org's channel link
# and points the scaffold's runner at it (ZOTERO_PLUGIN_ZOTERO_BIN_PATH).
# On Ubuntu the scaffold's own headless setup still runs (xvfb and the
# Ubuntu 24 libraries; it skips its beta download when a binary is given);
# on Windows and macOS it is Linux-only and is skipped
# (ZOTERO_SETUP_COMPLETE). The twelve jobs run side by side: the wait is
# the slowest one's.

on:
  # Main only: a release tag sits on a commit this has already passed, and
  # release.yml checks that run instead of starting another (2026-11-03).
  # A push that changes only documentation starts no run (a release bump
  # touches package.json, so the release gate still finds its run).
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  # Weekly, against whatever Zotero release and beta are then: no Test run
  # happened from 10-26 to 11-03 while Zotero 10.0.7 shipped on 10-29
  # (the 2026-11-03 study, recommendation 4). Mondays 04:00 UTC.
  schedule:
    - cron: "0 4 * * 1"
  # Manual trigger from the Actions tab — handy when you want to
  # re-run after a flaky failure without pushing an empty commit.
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit lands —
# saves runner minutes on rapid push-push-push iteration.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Opt into the Node 24 runtime for actions themselves (not just
# the project's Node toolchain). Silences the deprecation warning
# about actions/checkout@v7 and actions/setup-node@v7 running on
# Node 20, which becomes the forced default on 2026-06-02.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Mocha + Chai (${{ matrix.label }}, Zotero ${{ matrix.channel }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The macOS jobs report but do not decide the run (MJT 2026-11-03,
    # "Ok to fix"): Zotero crashes there at a reader window's close, the
    # cause not yet known; until it is, a red macOS job leaves the run --
    # and release.yml's gate on it -- green. Drop `experimental` from the
    # macOS rows once they pass.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      # One red job never cancels the others: each system and channel
      # reports on its own.
      fail-fast: false
      # Shards (WV_TEST_SHARD, zotero-plugin.config.ts: contiguous,
      # size-balanced slices of the spec files, the 000- helpers in each;
      # the 2026-11-03 study, recommendation 7): two per job, for time
      # (MJT 2026-11-04, "2 shards"). Twelve jobs, four on macOS (GitHub's
      # free plan runs 20 at once, 5 of them macOS). The memory that once
      # argued for more -- a run's Zotero at 5-11 GB, a macOS half killed
      # at 6 GB on the 7 GB runner -- was the scaffold's Browser Toolbox
      # attached to the runner's Zotero (zotero-plugin.config.ts,
      # server.devtools), not Zotero's reader: without it the whole suite
      # peaks near 2 GB. `part` names the shard where a "/" cannot go (the
      # logs' artifact).
      matrix:
        include:
          - { os: ubuntu-latest, label: Ubuntu, channel: release, experimental: false, shard: "1/2", part: "-1of2" }
          - { os: ubuntu-latest, label: Ubuntu, channel: release, experimental: false, shard: "2/2", part: "-2of2" }
          - { os: ubuntu-latest, label: Ubuntu, channel: beta, experimental: false, shard: "1/2", part: "-1of2" }
          - { os: ubuntu-latest, label: Ubuntu, channel: beta, experimental: false, shard: "2/2", part: "-2of2" }
          - { os: windows-latest, label: Windows, channel: release, experimental: false, shard: "1/2", part: "-1of2" }
          - { os: windows-latest, label: Windows, channel: release, experimental: false, shard: "2/2", part: "-2of2" }
          - { os: windows-latest, label: Windows, channel: beta, experimental: false, shard: "1/2", part: "-1of2" }
          - { os: windows-latest, label: Windows, channel: beta, experimental: false, shard: "2/2", part: "-2of2" }
          - { os: macos-latest, label: macOS, channel: release, experimental: true, shard: "1/2", part: "-1of2" }
          - { os: macos-latest, label: macOS, channel: release, experimental: true, shard: "2/2", part: "-2of2" }
          - { os: macos-latest, label: macOS, channel: beta, experimental: true, shard: "1/2", part: "-1of2" }
          - { os: macos-latest, label: macOS, channel: beta, experimental: true, shard: "2/2", part: "-2of2" }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: lts/*
          cache: npm

      # node_modules kept per system, Node version and lockfile, as Zotero
      # caches its own (its ci.yml): `npm ci` took ~3 min of each Windows job.
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      # `npm ci` honours the lockfile exactly — fails fast if the
      # lockfile and package.json have drifted, which is what we
      # want for reproducible CI runs.
      - name: Install dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      # No download but Zotero's: the scaffold's update check off, the
      # pinned chai.js in place (ci/prepare.mjs, ci/README.md).
      - name: Prepare (no outside downloads)
        run: node ci/prepare.mjs

      # Platform-independent: once, on one job.
      - name: Type-check (tsc --noEmit)
        if: matrix.os == 'ubuntu-latest' && matrix.channel == 'beta'
        run: npm run typecheck

      - name: Run unit tests (Node tier)
        if: matrix.os == 'ubuntu-latest' && matrix.channel == 'beta'
        run: npm run test:unit

      - name: Install Zotero (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/zotero"
          mkdir -p "$dir"
          curl -fsSL -o "$RUNNER_TEMP/zotero.tar.xz" "https://www.zotero.org/download/client/dl?channel=${{ matrix.channel }}&platform=linux-x86_64"
          tar -xf "$RUNNER_TEMP/zotero.tar.xz" -C "$dir"
          exe="$(find "$dir" -maxdepth 2 -type f -name zotero | head -n 1)"
          test -n "$exe" || { echo "zotero not found in the archive"; exit 1; }
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$exe" >> "$GITHUB_ENV"

      - name: Install Zotero (Windows, portable ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "zotero.zip"
          $dir = Join-Path $env:RUNNER_TEMP "zotero"
          Invoke-WebRequest -Uri "https://www.zotero.org/download/client/dl?channel=${{ matrix.channel }}&platform=win-x64-zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          $exe = Get-ChildItem -Path $dir -Recurse -Filter zotero.exe | Select-Object -First 1
          if (-not $exe) { throw "zotero.exe not found in the ZIP" }
          "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZOTERO_SETUP_COMPLETE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Zotero (macOS, disk image)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$RUNNER_TEMP/zotero.dmg"
          mnt="$RUNNER_TEMP/zotero-mnt"
          curl -fsSL -o "$dmg" "https://www.zotero.org/download/client/dl?channel=${{ matrix.channel }}&platform=mac"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          cp -R "$mnt/Zotero.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          exe="$RUNNER_TEMP/Zotero.app/Contents/MacOS/zotero"
          test -x "$exe" || { echo "zotero not found in the disk image"; exit 1; }
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$exe" >> "$GITHUB_ENV"
          echo "ZOTERO_SETUP_COMPLETE=1" >> "$GITHUB_ENV"

      # A job passes only when the suite says so at its end. The scaffold
      # exits 0 whenever Zotero closes, unless a test had already failed
      # (scaffold-src-*.mjs ~4399-4406): in the first six-job run
      # (41649386843) three jobs were "green" with no summary line -- Windows
      # beta stopped after 101 tests, both macOS jobs after ~1300 (the
      # 2026-11-03 study, work/zotero-release-ci-study-2026-11-03.md; Zotero's
      # own runner passes only on a `success` file written at the end,
      # test/runtests.sh). The summary line is required, without failures.
      - name: Run tests
        shell: bash
        env:
          WV_TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/wv-test.log"
          summary="$(grep -a -o 'Test run completed - [0-9]* passed[^[:cntrl:]]*' "$RUNNER_TEMP/wv-test.log" | tail -n 1 || true)"
          echo "summary: ${summary:-none}"
          if [ -z "$summary" ]; then
            echo "::error::The suite did not finish: Zotero closed before the end of the run (no 'Test run completed' line)."
            exit 1
          fi
          case "$summary" in *failed*) echo "::error::$summary"; exit 1;; esac

      # The run's log and the suite's quit trace (test/000-helpers.spec.js
      # writes every quit request with its JS stack, and every window close,
      # to the OS temp folder): kept with each job, red or green, to see why
      # Zotero closed mid-suite (both macOS jobs at the reader-window wiring
      # spec, 2026-11-03).
      - name: Collect the run's logs
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/wv-artifacts"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/wv-test.log" "$out/" 2>/dev/null || true
          for d in "${TMPDIR:-}" "${TEMP:-}" /tmp; do
            if [ -n "$d" ] && [ -f "$d/wv-test-quit-trace.txt" ]; then cp "$d/wv-test-quit-trace.txt" "$out/"; break; fi
          done
          # A crash leaves no quit request in the trace (both macOS jobs,
          # 2026-11-03, at a reader window's close): keep what the system
          # and Gecko wrote about it -- macOS's crash reports, the test
          # profile's minidumps.
          # Every report from the run, not only Zotero's: a process the system
          # killed for memory leaves a JetsamEvent report instead.
          if [ "$RUNNER_OS" = "macOS" ]; then
            for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
              find "$d" -maxdepth 2 -type f -mmin -45 -exec cp {} "$out/" \; 2>/dev/null || true
            done
          fi
          if [ -d .scaffold/test/profile/minidumps ]; then cp -R .scaffold/test/profile/minidumps "$out/" 2>/dev/null || true; fi
          ls -la "$out"

      - name: Upload the run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.label }}-${{ matrix.channel }}${{ matrix.part }}
          path: ${{ runner.temp }}/wv-artifacts
          if-no-files-found: warn
          retention-days: 14
