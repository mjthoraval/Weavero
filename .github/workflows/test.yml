name: Test

# DIAGNOSTIC VERSION -- branch ci-macdiag ONLY (2026-11-23), never merge.
#
# Why do some cases fail only on GitHub's macOS runner with the Zotero beta
# (1.2.1 release CI: runs 45194797794, 45200266733, 45213037676), while they
# pass on Windows, Ubuntu, macOS with Zotero 10 and locally? This version runs
# ONLY macOS, on a manual dispatch:
#
#   gh workflow run test.yml --ref ci-macdiag                     (targeted)
#   gh workflow run test.yml --ref ci-macdiag -f scope=shards     (full halves)
#   ... -f awake=true   keeps the display awake (caffeinate) -- the A/B for
#                       the display-sleep / occlusion hypothesis
#
# targeted: the failing specs only (the beta's in two jobs, Zotero 10's two in
#   one), the 000- helpers staged as always (zotero-plugin.config.ts).
# shards: the four macOS halves as the failing runs had them (the earlier
#   specs' leftovers included, which a targeted run cannot reproduce).
#
# The specs on this branch write diagnostic records (test/000-helpers.spec.js
# wvT.diag) to wv-macdiag.jsonl in the uploaded folder (WV_DIAG_DIR); each
# line also goes to the run's log as "[wv-diag] ...". A step before the tests
# writes the runner's displays and console session (runner-display.txt), a
# sampler every 30 s during them (runner-session-samples.txt).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "targeted = only the failing specs; shards = the four full macOS halves"
        type: choice
        options: [targeted, shards]
        default: targeted
      awake:
        description: "keep the runner's display and system awake during the tests (caffeinate -dimsu)"
        type: boolean
        default: false

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: Plan the macOS rows
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          # Beta, part A: feed abstract (and the 133075 tripwire), link-preview
          # tint, count-cell tooltip, note outline. Part B: per-window filter
          # observer, pinned-section drag, Lock Tab. Zotero 10: the Settings
          # window width and the 133075 tripwire.
          A="test/count-popups.spec.js,test/note-outline.spec.js,test/preview-entry-highlight.spec.js,test/upstream-fixes.spec.js"
          B="test/per-window-state.spec.js,test/pin-anchor.spec.js,test/split-dock.spec.js"
          R="test/prefs-search-align.spec.js,test/upstream-fixes.spec.js"
          row() { jq -nc --arg c "$1" --arg t "$2" --arg s "$3" --arg p "$4" --arg e "$5" '{channel: $c, title: $t, shard: $s, part: $p, entries: $e}'; }
          if [ "$SCOPE" = "shards" ]; then
            rows="$(row beta 'shard 1/2' 1/2 -1of2 '') $(row beta 'shard 2/2' 2/2 -2of2 '') $(row release 'shard 1/2' 1/2 -1of2 '') $(row release 'shard 2/2' 2/2 -2of2 '')"
          else
            rows="$(row beta 'targeted A' '' -A "$A") $(row beta 'targeted B' '' -B "$B") $(row release 'targeted' '' -diag "$R")"
          fi
          matrix="$(echo "$rows" | jq -sc '{include: .}')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: macOS diag (Zotero ${{ matrix.channel }}, ${{ matrix.title }})
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: lts/*
          cache: npm

      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare (no outside downloads)
        run: node ci/prepare.mjs

      - name: Install Zotero (macOS, disk image)
        shell: bash
        run: |
          dmg="$RUNNER_TEMP/zotero.dmg"
          mnt="$RUNNER_TEMP/zotero-mnt"
          curl -fsSL -o "$dmg" "https://www.zotero.org/download/client/dl?channel=${{ matrix.channel }}&platform=mac"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          cp -R "$mnt/Zotero.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          exe="$RUNNER_TEMP/Zotero.app/Contents/MacOS/zotero"
          test -x "$exe" || { echo "zotero not found in the disk image"; exit 1; }
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$exe" >> "$GITHUB_ENV"
          echo "ZOTERO_SETUP_COMPLETE=1" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/Zotero.app/Contents/Info.plist" || true

      # The runner's screens (resolution, scale) and console session (a locked
      # or asleep display occludes every window: no animation frames, clamped
      # timers). The Zotero main window's own size at the start of the run is
      # the "run-start" record (printed after the tests, step below).
      - name: Runner display and session (diagnostic)
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/wv-artifacts"
          mkdir -p "$out"
          {
            echo "== sw_vers"; sw_vers
            echo "== hardware"; uname -m; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
            echo "== system_profiler SPDisplaysDataType"; system_profiler SPDisplaysDataType
            echo "== NSScreen (points, visible frame, backing scale)"
            osascript -l JavaScript -e 'ObjC.import("AppKit"); var s = $.NSScreen.screens, o = []; for (var i = 0; i < s.count; i++) { var c = s.objectAtIndex(i), f = c.frame, v = c.visibleFrame; o.push("screen " + i + ": " + f.size.width + "x" + f.size.height + " at " + f.origin.x + "," + f.origin.y + ", visible " + v.size.width + "x" + v.size.height + ", backingScaleFactor " + c.backingScaleFactor); } o.join("\n")'
            echo "== console session"; ioreg -n Root -d1 | grep -o -E '"(CGSSessionScreenIsLocked|kCGSSessionOnConsoleKey|kCGSessionLoginDoneKey)"=[^,}]*'
            echo "== power"; pmset -g; pmset -g assertions
            echo "== screensaver"; defaults -currentHost read com.apple.screensaver 2>&1; defaults read com.apple.screensaver 2>&1
          } 2>&1 | tee "$out/runner-display.txt"

      - name: Run tests
        shell: bash
        env:
          WV_TEST_SHARD: ${{ matrix.shard }}
          WV_TEST_ENTRIES: ${{ matrix.entries }}
          WV_DIAG_DIR: ${{ runner.temp }}/wv-artifacts
          WV_AWAKE: ${{ inputs.awake }}
        run: |
          out="$WV_DIAG_DIR"
          mkdir -p "$out"
          if [ "$WV_AWAKE" = "true" ]; then caffeinate -dimsu & echo "caffeinate -dimsu (pid $!)"; fi
          # The console session and the power assertions every 30 s.
          ( set +e +o pipefail
            while :; do
              {
                printf '%s ' "$(date -u +%H:%M:%S)"
                ioreg -n Root -d1 | grep -o -E '"(CGSSessionScreenIsLocked|kCGSSessionOnConsoleKey)"=[A-Za-z]+' | tr '\n' ' '
                pmset -g assertions | grep -E '^ *(PreventUserIdleDisplaySleep|PreventUserIdleSystemSleep|UserIsActive) ' | tr -s ' ' | tr '\n' ' '
                echo
              } >> "$out/runner-session-samples.txt" 2>&1
              sleep 30
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/wv-test.log"
          summary="$(grep -a -o 'Test run completed - [0-9]* passed[^[:cntrl:]]*' "$RUNNER_TEMP/wv-test.log" | tail -n 1 || true)"
          echo "summary: ${summary:-none}"
          if [ -z "$summary" ]; then
            echo "::error::The suite did not finish: Zotero closed before the end of the run (no 'Test run completed' line)."
            exit 1
          fi
          case "$summary" in *failed*) echo "::error::$summary"; exit 1;; esac

      # The records in one JSON array (wv-macdiag.json), and the run's start
      # (Zotero's version, the main window and screen, frames and timers).
      - name: Diagnostics (wv-macdiag)
        if: always()
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/wv-artifacts"
          mkdir -p "$out"
          f="$out/wv-macdiag.jsonl"
          if [ ! -f "$f" ]; then
            for d in "${TMPDIR:-}" /tmp; do
              if [ -n "$d" ] && [ -f "$d/wv-macdiag.jsonl" ]; then cp "$d/wv-macdiag.jsonl" "$f"; break; fi
            done
          fi
          if [ -f "$f" ]; then
            jq -s . "$f" > "$out/wv-macdiag.json"
            echo "== run start: Zotero, main window, screen, frames and timers"
            jq -c 'select(.tag == "run-start") | .data | {version, os, abi, window: (.env | {outer, inner, pos, screen, dpr, windowState, hidden, isActiveWin, activeWin}), probe}' "$f"
            echo "== records by tag"
            jq -r '.tag' "$f" | sort | uniq -c
          else
            echo "no wv-macdiag.jsonl"
          fi
          echo "== session samples"
          cat "$out/runner-session-samples.txt" 2>/dev/null | tail -n 80

      - name: Collect the run's logs
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/wv-artifacts"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/wv-test.log" "$out/" 2>/dev/null || true
          for d in "${TMPDIR:-}" "${TEMP:-}" /tmp; do
            if [ -n "$d" ] && [ -f "$d/wv-test-quit-trace.txt" ]; then cp "$d/wv-test-quit-trace.txt" "$out/"; break; fi
          done
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$d" -maxdepth 2 -type f -mmin -45 -exec cp {} "$out/" \; 2>/dev/null || true
            { echo "== $d"; sudo ls -la "$d" 2>&1 | tail -n 40; } >> "$out/diagnostic-reports-listing.txt"
            sudo find "$d" -maxdepth 2 -type f -mmin -45 -exec cp {} "$out/" \; 2>/dev/null || true
          done
          sudo chmod -R a+r "$out" 2>/dev/null || true
          log show --last 40m --style compact --predicate 'process == "zotero"' 2>&1 | tail -n 3000 > "$out/unified-zotero.log" || true
          log show --last 40m --style compact --predicate 'eventMessage CONTAINS[c] "zotero" AND process != "zotero"' 2>&1 | tail -n 1500 > "$out/unified-about-zotero.log" || true
          if [ -d .scaffold/test/profile/minidumps ]; then cp -R .scaffold/test/profile/minidumps "$out/" 2>/dev/null || true; fi
          ls -la "$out"

      - name: Upload the run's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macdiag-${{ matrix.channel }}${{ matrix.part }}
          path: ${{ runner.temp }}/wv-artifacts
          if-no-files-found: warn
          retention-days: 14
